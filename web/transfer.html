<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перенос настроек Hub</title>
<style>
  :root { font-family: "Segoe UI", sans-serif; color-scheme: light dark; }
  main { max-width: 34rem; margin: 3rem auto; padding: 1rem; }
  button { font: inherit; padding: .6rem .9rem; margin: .25rem; cursor: pointer; }
  button:focus-visible { outline: 2px solid #389b83; outline-offset: 3px; }
</style>
</head>
<body>
<main class="transfer card">
  <h1>Перенос настроек Hub</h1>
  <p>Открой эту страницу в том же профиле браузера, где раньше пользовался Hub.</p>
  <button type="button" class="btn primary" id="transferBtn">Перенести тему и оформление</button>
  <button type="button" class="btn ghost" id="transferExport">Сохранить в файл</button>
  <p role="status" id="transferStatus"></p>
</main>
<script src="transfer.js"></script>
</body>
</html>
