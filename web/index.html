<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hub — полезное под рукой</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // Тема и анимации применяются до отрисовки, иначе тёмная тема начиналась бы с белой вспышки.
  try {
    if (localStorage.getItem("hub-theme") === "dark") document.documentElement.dataset.theme = "dark";
    if (localStorage.getItem("hub-motion") === "off") document.documentElement.dataset.motion = "off";
  } catch {
    /* localStorage может быть недоступен */
  }
</script>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-stage">
    <div class="splash-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="splash-name">Hub</p>
    <p class="splash-hint">полезное под рукой</p>
    <div class="splash-track" aria-hidden="true"><i></i></div>
  </div>
</div>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="2"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="2"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Hub</h1>
        <p>Полезное под рукой</p>
      </div>
    </div>

    <nav class="nav" id="toolNav" aria-label="Инструменты"></nav>

    <div class="sidebar-foot">
      <button class="theme-toggle" id="motionBtn" type="button" aria-pressed="true">
        <span class="theme-icon motion-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15.5c3.2 0 3.2-7 6.4-7s3.2 7 6.4 7 3.2-3.5 3.2-3.5"/>
            <circle cx="18.5" cy="6.5" r="1.4"/>
          </svg>
        </span>
        <span id="motionLabel">Анимации включены</span>
      </button>
      <button class="theme-toggle" id="themeBtn" type="button">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>
          </svg>
        </span>
        <span id="themeLabel">Тёмная тема</span>
      </button>
      <p class="storage-note">Всё хранится только на этом компьютере</p>
    </div>
  </aside>

  <main class="workspace">
    <header class="workspace-head">
      <h2 id="toolTitle">Загрузка…</h2>
      <p id="toolHint"></p>
    </header>
    <div id="toolRoot" class="tool-root"></div>
  </main>

</div>

<div class="toast hidden" id="toast" role="status"></div>

<div class="busy hidden" id="busy" aria-live="polite">
  <div class="busy-card">
    <span class="spinner" aria-hidden="true"></span>
    <span id="busyText">Работаю…</span>
  </div>
</div>

<script src="intro.js"></script>
<script src="app.js"></script>
<script src="tools/clipboard.js"></script>
<script src="tools/notes.js"></script>
<script src="tools/sorter.js"></script>
<script src="tools/dupes.js"></script>
<script src="tools/bigfiles.js"></script>
<script src="tools/diskmap.js"></script>
<script src="tools/compare.js"></script>
<script src="tools/cleanup.js"></script>
<script src="tools/monitor.js"></script>
<script src="tools/about.js"></script>
</body>
</html>
