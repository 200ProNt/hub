<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hub — Обмен с телефоном</title>
  <style>
    :root {
      --bg: #0f121a;
      --card: #181d2a;
      --card-soft: #202637;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f3fa;
      --muted: #8b97af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fa;
        --card: #ffffff;
        --card-soft: #f0f2f8;
        --border: rgba(0, 0, 0, 0.08);
        --text: #171923;
        --muted: #64748b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
    }
    .header-title { font-size: 18px; font-weight: 650; }
    .header-sub { font-size: 12px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 10px;
    }
    textarea:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { background: var(--card-soft); color: var(--text); border: 1px solid var(--border); }
    .file-input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .clip-preview {
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 13.5px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 10px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .file-info { min-width: 0; flex: 1; padding-right: 8px; }
    .file-name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 11px; color: var(--muted); }
    .download-btn {
      flex: none;
      padding: 6px 12px;
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-logo">H</div>
    <div>
      <h1 class="header-title">Hub QR-Drop</h1>
      <p class="header-sub">Прямая связь смартфона с ПК по Wi-Fi</p>
    </div>
  </header>

  <!-- Секция 1: Отправка текста на ПК -->
  <section class="card">
    <h2 class="card-title">📱 Отправить текст или ссылку на ПК</h2>
    <textarea id="phoneText" placeholder="Введи или вставь текст, заметку или ссылку…"></textarea>
    <button class="btn" id="sendTextBtn" type="button">Отправить в буфер ПК</button>
  </section>

  <!-- Секция 2: Получение из буфера ПК -->
  <section class="card">
    <h2 class="card-title">💻 Буфер обмена компьютера</h2>
    <div class="clip-preview" id="pcClipText">Загрузка данных…</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" id="copyPcBtn" type="button">Скопировать на телефон</button>
      <button class="btn secondary" id="refreshPcBtn" type="button" style="width: auto; padding: 0 16px;">↻</button>
    </div>
  </section>

  <!-- Секция 3: Загрузка файлов на ПК -->
  <section class="card">
    <h2 class="card-title">📤 Отправить фото или файл на ПК</h2>
    <div class="file-input-wrapper">
      <button class="btn secondary" type="button" id="filePickBtn">Выбрать файлы на телефоне</button>
      <input type="file" id="phoneFileInput" multiple>
    </div>
    <div id="uploadStatus" style="font-size: 12.5px; color: var(--muted); text-align: center;"></div>
  </section>

  <!-- Секция 4: Файлы с ПК -->
  <section class="card">
    <h2 class="card-title">📥 Файлы, доступные с компьютера</h2>
    <div id="sharedFilesList">
      <p style="font-size: 13px; color: var(--muted); text-align: center; padding: 10px 0;">На ПК пока нет файлов в раздаче</p>
    </div>
  </section>

  <div id="toast" class="toast">Текст отправлен на ПК!</div>

  <script>
    const toast = document.getElementById("toast");
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // Отправка текста
    document.getElementById("sendTextBtn").addEventListener("click", async () => {
      const val = document.getElementById("phoneText").value.trim();
      if (!val) return showToast("Введи текст перед отправкой");
      try {
        const res = await fetch("/api/drop/send-text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: val, source: "phone" })
        });
        if (res.ok) {
          showToast("Текст передан в буфер ПК!");
          document.getElementById("phoneText").value = "";
        }
      } catch (e) {
        showToast("Ошибка связи с компьютером");
      }
    });

    // Загрузка буфера ПК
    async function loadPcClipboard() {
      try {
        const res = await fetch("/api/drop/latest-text");
        const data = await res.json();
        const text = data.clipboard || data.latest_text || "Буфер обмена пуст";
        document.getElementById("pcClipText").textContent = text;
      } catch (e) {
        document.getElementById("pcClipText").textContent = "Не удалось прочитать буфер ПК";
      }
    }
    document.getElementById("refreshPcBtn").addEventListener("click", loadPcClipboard);
    document.getElementById("copyPcBtn").addEventListener("click", async () => {
      const text = document.getElementById("pcClipText").textContent;
      if (text && text !== "Буфер обмена пуст") {
        await navigator.clipboard.writeText(text);
        showToast("Скопировано на смартфон!");
      }
    });

    // Отправка файла
    document.getElementById("phoneFileInput").addEventListener("change", async (e) => {
      const files = e.target.files;
      if (!files.length) return;
      const status = document.getElementById("uploadStatus");
      status.textContent = "Отправляю " + files.length + " файл(ов)...";
      const formData = new FormData();
      for (const f of files) formData.append("files", f, f.name);
      try {
        const res = await fetch("/api/drop/upload", { method: "POST", body: formData });
        if (res.ok) {
          status.textContent = "✓ Файлы успешно переданы на ПК!";
          showToast("Файлы переданы на ПК!");
          loadShared();
        } else {
          status.textContent = "Ошибка при отправке";
        }
      } catch (err) {
        status.textContent = "Ошибка отправки: " + err.message;
      }
    });

    // Список файлов с ПК
    async function loadShared() {
      try {
        const res = await fetch("/api/drop/info");
        const data = await res.json();
        const list = document.getElementById("sharedFilesList");
        if (data.shared_files && data.shared_files.length) {
          list.innerHTML = data.shared_files.map(f => `
            <div class="file-item">
              <div class="file-info">
                <div class="file-name">${f.name}</div>
                <div class="file-size">${(f.size / 1024 / 1024).toFixed(1)} МБ</div>
              </div>
              <a href="${f.url}" download class="download-btn">Скачать</a>
            </div>
          `).join("");
        } else {
          list.innerHTML = '<p style="font-size: 13px; color: var(--muted); text-align: center; padding: 10px 0;">На ПК пока нет файлов в раздаче</p>';
        }
      } catch (e) {}
    }

    loadPcClipboard();
    loadShared();
  </script>
</body>
</html>
